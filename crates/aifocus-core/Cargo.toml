[package]
name = "ardisa-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Core language model for Ardisa"

[features]
default = []
native-desktop = ["dep:minifb", "dep:font8x8"]

[dependencies]
minifb = { version = "=0.27.0", optional = true }
font8x8 = { version = "=0.3.1", optional = true }
unicode-segmentation = "=1.12.0"
sha2 = "0.10.9"
