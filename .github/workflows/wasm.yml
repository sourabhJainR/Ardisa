name: WebAssembly Runtime

on:
  pull_request:
    paths:
      - "crates/ardisa-wasm/**"
      - "crates/aifocus-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/wasm.yml"
  push:
    branches: [main]
    paths:
      - "crates/ardisa-wasm/**"
      - "crates/aifocus-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/wasm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ardisa-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check browser runtime for WebAssembly
        run: cargo check -p ardisa-wasm --target wasm32-unknown-unknown
      - name: Test browser runtime host boundary
        run: cargo test -p ardisa-wasm

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Run browser parity test
        run: wasm-pack test --headless --chrome crates/ardisa-wasm
