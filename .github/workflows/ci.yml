name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ardisa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust compiler, runtime, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Normalize and validate Rust formatting
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets

  bootstrap:
    name: Bootstrap probe stage-2/stage-3 reproducibility gate
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: chmod +x bootstrap/verify_self_hosting.sh
      - run: ./bootstrap/verify_self_hosting.sh
      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ardisa-bootstrap-evidence
          path: bootstrap/evidence/
          if-no-files-found: ignore

  generated:
    name: Generated differential and holdout corpus
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ardisa-core fuzz --all-targets -- --nocapture
      - run: cargo test -p ardisa-core differential --all-targets -- --nocapture
      - run: cargo test -p ardisa-core benchmark --all-targets -- --nocapture
      - name: Smoke-test native VM dispatch benchmark
        run: cargo run --release -p ardisa-core --example native_dispatch_bench -- --iterations 1

  self-hosting-status:
    name: Self-hosting evidence contract (fail-closed)
    runs-on: ubuntu-latest
    needs: [bootstrap, generated]
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f bootstrap/compiler.ardisa
          grep -q 'ARDISA-EXEC-V1' bootstrap/native_codegen.ardisa
          echo "Bootstrap source and native artifact contract present; compiler self-hosting remains fail-closed."
