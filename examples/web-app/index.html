<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ardisa Web App Demo</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101827; color: #edf2f7; }
    main { width: min(90vw, 620px); padding: 2rem; border: 1px solid #344256; border-radius: 18px; background: #182437; box-shadow: 0 18px 60px #0005; }
    h1 { margin-top: 0; } .muted { color: #b7c4d6; }
    .status { padding: 1rem; margin: 1.2rem 0; border-radius: 12px; background: #0e1725; }
    button { border: 0; border-radius: 8px; padding: .7rem 1rem; background: #8bd5ca; color: #10202b; font-weight: 700; cursor: pointer; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <p class="muted">LANGUAGE DEMO</p>
    <h1>Ardisa, end to end</h1>
    <p>This page calls a local HTTP endpoint. The endpoint executes <code>examples/web_app.ardisa</code> with Ardisa's native runner and returns its result.</p>
    <section class="status" aria-live="polite">
      <strong id="headline">Checking Ardisa runtime…</strong>
      <p id="details" class="muted">Waiting for /api/status</p>
    </section>
    <button id="refresh">Run check again</button>
  </main>
  <script>
    async function refreshStatus() {
      const headline = document.querySelector("#headline");
      const details = document.querySelector("#details");
      headline.textContent = "Running…";
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || data.error || response.statusText);
        headline.textContent = data.ok ? "Ardisa returned HTTP " + data.status : "Unexpected status";
        details.textContent = "Result from " + data.runtime + ".";
      } catch (error) {
        headline.textContent = "Runtime check failed";
        details.textContent = error.message;
      }
    }
    document.querySelector("#refresh").addEventListener("click", refreshStatus);
    refreshStatus();
  </script>
</body>
</html>
